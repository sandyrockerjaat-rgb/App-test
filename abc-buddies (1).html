<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC Buddies</title>
<style>
  :root{
    --sky-top:#8ED8F8;
    --sky-bottom:#FFE9A8;
    --grass:#8CD98C;
    --ink:#2E2A4A;
    --card:#FFFFFF;
    --pink:#FF6FA5;
    --orange:#FF9A3C;
    --yellow:#FFCF3F;
    --green:#4CC26B;
    --blue:#3FA9F5;
    --purple:#9B6BFF;
    --red:#FF5C5C;
    --teal:#2FC9C0;
    font-family: "Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  #app{position:relative;width:100%;height:100%;max-width:900px;margin:0 auto;overflow:hidden;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 65%, var(--grass) 65%, var(--grass) 100%);}

  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;opacity:0;transition:opacity .35s ease;}
  .screen.active{display:flex;opacity:1;}

  /* ---------- floating decor ---------- */
  .decor{position:absolute;font-size:42px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08));pointer-events:none;
    animation:float 7s ease-in-out infinite;opacity:.9;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-22px) rotate(4deg);}}

  /* ---------- top bar buttons ---------- */
  .topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:10;}
  .round-btn{width:64px;height:64px;border-radius:50%;border:none;font-size:28px;display:flex;align-items:center;
    justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer;background:var(--card);color:var(--ink);
    transition:transform .12s;}
  .round-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.15);}

  /* ================= HOME SCREEN ================= */
  #home-screen{justify-content:space-between;}
  .home-top{margin-top:38px;text-align:center;z-index:2;}
  .logo-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .logo-letter{font-size:min(14vw,64px);font-weight:800;text-shadow:0 5px 0 rgba(0,0,0,.12);
    display:inline-block;animation:bob 2.4s ease-in-out infinite;}
  .logo-letter:nth-child(1){color:var(--red);animation-delay:.0s}
  .logo-letter:nth-child(2){color:var(--orange);animation-delay:.1s}
  .logo-letter:nth-child(3){color:var(--yellow);animation-delay:.2s}
  .logo-letter:nth-child(4){color:var(--green);animation-delay:.3s}
  .logo-letter:nth-child(5){color:var(--blue);animation-delay:.4s}
  .logo-letter:nth-child(6){color:var(--purple);animation-delay:.5s}
  .logo-letter:nth-child(7){color:var(--pink);animation-delay:.6s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .tagline{margin-top:6px;font-size:min(5vw,20px);color:var(--ink);font-weight:700;opacity:.75;}

  .home-characters{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:6vw;z-index:2;}
  .char{font-size:min(30vw,180px);filter:drop-shadow(0 10px 8px rgba(0,0,0,.15));}
  .char.mom{animation:wave 2.6s ease-in-out infinite;transform-origin:70% 30%;}
  .char.kid{animation:hop 1.6s ease-in-out infinite;}
  @keyframes wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .speech-bubble{position:absolute;top:-6px;right:-6px;background:#fff;border-radius:20px;padding:8px 14px;
    font-size:15px;font-weight:700;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1);animation:pop .4s ease-out;}

  .home-bottom{width:100%;display:flex;flex-direction:column;align-items:center;padding-bottom:28px;z-index:2;}
  #start-btn{border:none;background:linear-gradient(180deg,#FF8A65,#FF6F3C);color:#fff;font-weight:800;
    font-size:min(8vw,38px);padding:20px 68px;border-radius:60px;box-shadow:0 8px 0 #C4451B, 0 14px 22px rgba(0,0,0,.25);
    letter-spacing:1px;animation:pulse 1.8s ease-in-out infinite;cursor:pointer;transition:transform .1s;}
  #start-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #C4451B;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

  /* ================= ALPHABET SCREEN ================= */
  #alphabet-screen{justify-content:flex-start;padding-top:90px;}
  .grid-title{font-size:min(6vw,26px);font-weight:800;color:var(--ink);margin-bottom:10px;}
  .letter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:10px;width:100%;
    max-width:780px;overflow-y:auto;padding:4px 4px 24px;flex:1;}
  .letter-tile{aspect-ratio:1/1;border:none;border-radius:22px;font-size:min(7vw,30px);font-weight:800;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer;transition:transform .12s;}
  .letter-tile:active{transform:translateY(5px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.15);}

  /* ================= LETTER LEARNING SCREEN ================= */
  #letter-screen{justify-content:center;}
  .big-letter-wrap{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:20px;}
  .nav-arrow{width:56px;height:56px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:26px;
    box-shadow:0 5px 0 rgba(0,0,0,.12);cursor:pointer;flex:none;}
  .nav-arrow:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
  #big-letter{font-size:min(45vw,220px);font-weight:800;line-height:1;color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.15);
    animation:letterPop .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes letterPop{0%{transform:scale(.2) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}

  .object-card{margin-top:6px;background:#fff;border-radius:36px;padding:22px 40px;display:flex;flex-direction:column;
    align-items:center;box-shadow:0 10px 26px rgba(0,0,0,.15);}
  #big-emoji{font-size:min(28vw,140px);animation:emojiIn .6s cubic-bezier(.34,1.56,.64,1) .15s both;}
  @keyframes emojiIn{0%{transform:scale(0) translateY(30px);opacity:0}70%{transform:scale(1.2) translateY(-6px);opacity:1}100%{transform:scale(1) translateY(0)}}
  #word-label{margin-top:6px;font-size:min(7vw,32px);font-weight:800;color:var(--ink);}

  .letter-controls{display:flex;gap:16px;margin-top:22px;}
  .pill-btn{border:none;border-radius:40px;padding:16px 26px;font-size:min(5.5vw,22px);font-weight:800;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .pill-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
  #replay-btn{background:linear-gradient(180deg,#4FC3F7,#2E9CE0);}

  /* mute icon in topbar */
  #mute-btn.muted::after{content:'🔇';}
  #mute-btn::after{content:'🔊';}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME SCREEN ============ -->
  <div id="home-screen" class="screen active">
    <div class="topbar">
      <div></div>
      <button class="round-btn" id="mute-btn" aria-label="Sound"></button>
    </div>

    <div class="home-top">
      <div class="logo-row">
        <span class="logo-letter">A</span><span class="logo-letter">B</span><span class="logo-letter">C</span>
        <span class="logo-letter">B</span><span class="logo-letter">u</span><span class="logo-letter">d</span><span class="logo-letter">s</span>
      </div>
      <div class="tagline">Learn letters together!</div>
    </div>

    <div class="home-characters">
      <span class="char mom">👩</span>
      <span class="char kid">🧒</span>
      <div class="speech-bubble">Let's play!</div>
    </div>

    <div class="home-bottom">
      <button id="start-btn">START</button>
    </div>
  </div>

  <!-- ============ ALPHABET SCREEN ============ -->
  <div id="alphabet-screen" class="screen">
    <div class="topbar">
      <button class="round-btn" id="back-to-home-1" aria-label="Home">🏠</button>
      <button class="round-btn" id="mute-btn-2" aria-label="Sound"></button>
    </div>
    <div class="grid-title">Pick a letter!</div>
    <div class="letter-grid" id="letter-grid"></div>
  </div>

  <!-- ============ LETTER LEARNING SCREEN ============ -->
  <div id="letter-screen" class="screen">
    <div class="topbar">
      <button class="round-btn" id="back-to-grid" aria-label="Back">⬅️</button>
      <button class="round-btn" id="back-to-home-2" aria-label="Home">🏠</button>
    </div>

    <div class="big-letter-wrap">
      <button class="nav-arrow" id="prev-letter" aria-label="Previous letter">⬅️</button>
      <div id="big-letter">A</div>
      <button class="nav-arrow" id="next-letter" aria-label="Next letter">➡️</button>
    </div>

    <div class="object-card">
      <div id="big-emoji">🍎</div>
      <div id="word-label">Apple</div>
    </div>

    <div class="letter-controls">
      <button class="pill-btn" id="replay-btn">🔊 Say it again</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------------- Data ----------------
  const DATA = [
    {l:"A",w:"Apple",e:"🍎"},{l:"B",w:"Ball",e:"⚽"},{l:"C",w:"Cat",e:"🐱"},
    {l:"D",w:"Dog",e:"🐶"},{l:"E",w:"Elephant",e:"🐘"},{l:"F",w:"Fish",e:"🐟"},
    {l:"G",w:"Grapes",e:"🍇"},{l:"H",w:"Hat",e:"🎩"},{l:"I",w:"Ice Cream",e:"🍦"},
    {l:"J",w:"Juice",e:"🧃"},{l:"K",w:"Kite",e:"🪁"},{l:"L",w:"Lion",e:"🦁"},
    {l:"M",w:"Moon",e:"🌙"},{l:"N",w:"Nest",e:"🪹"},{l:"O",w:"Orange",e:"🍊"},
    {l:"P",w:"Penguin",e:"🐧"},{l:"Q",w:"Queen",e:"👑"},{l:"R",w:"Rainbow",e:"🌈"},
    {l:"S",w:"Sun",e:"☀️"},{l:"T",w:"Tiger",e:"🐯"},{l:"U",w:"Umbrella",e:"☂️"},
    {l:"V",w:"Violin",e:"🎻"},{l:"W",w:"Whale",e:"🐳"},{l:"X",w:"X-ray",e:"🩻"},
    {l:"Y",w:"Yo-yo",e:"🪀"},{l:"Z",w:"Zebra",e:"🦓"}
  ];
  const PALETTE = ["#FF6FA5","#FF9A3C","#FFCF3F","#4CC26B","#3FA9F5","#9B6BFF","#FF5C5C","#2FC9C0"];

  let muted = false;
  let currentIndex = 0;

  // ---------------- Screen nav ----------------
  const screens = {
    home: document.getElementById("home-screen"),
    alphabet: document.getElementById("alphabet-screen"),
    letter: document.getElementById("letter-screen")
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  // ---------------- Build decor (floating clouds/stars) ----------------
  const decorEmojis = ["☁️","⭐","☁️","✨","⭐"];
  decorEmojis.forEach((em,i)=>{
    const d = document.createElement("div");
    d.className = "decor";
    d.textContent = em;
    d.style.left = (8 + i*20) + "%";
    d.style.top = (6 + (i%3)*8) + "%";
    d.style.animationDelay = (i*0.6)+"s";
    d.style.fontSize = (28 + (i%3)*14)+"px";
    screens.home.appendChild(d);
  });

  // ---------------- Build alphabet grid ----------------
  const grid = document.getElementById("letter-grid");
  DATA.forEach((item, idx)=>{
    const btn = document.createElement("button");
    btn.className = "letter-tile";
    btn.textContent = item.l;
    btn.style.background = PALETTE[idx % PALETTE.length];
    btn.addEventListener("click", ()=> openLetter(idx));
    grid.appendChild(btn);
  });

  // ---------------- Letter screen ----------------
  const bigLetterEl = document.getElementById("big-letter");
  const bigEmojiEl = document.getElementById("big-emoji");
  const wordLabelEl = document.getElementById("word-label");
  const objectCard = document.querySelector(".object-card");

  function openLetter(idx){
    currentIndex = ((idx % DATA.length) + DATA.length) % DATA.length;
    const item = DATA[currentIndex];
    const color = PALETTE[currentIndex % PALETTE.length];

    // reset animations by cloning
    bigLetterEl.style.animation = "none";
    bigEmojiEl.style.animation = "none";
    void bigLetterEl.offsetWidth; void bigEmojiEl.offsetWidth;
    bigLetterEl.style.animation = "";
    bigEmojiEl.style.animation = "";

    bigLetterEl.textContent = item.l;
    bigLetterEl.style.color = color;
    bigEmojiEl.textContent = item.e;
    wordLabelEl.textContent = item.w;
    objectCard.style.borderColor = color;

    showScreen("letter");
    speak(item.l + " for " + item.w + ".");
  }

  document.getElementById("prev-letter").addEventListener("click", ()=> openLetter(currentIndex-1));
  document.getElementById("next-letter").addEventListener("click", ()=> openLetter(currentIndex+1));
  document.getElementById("replay-btn").addEventListener("click", ()=>{
    const item = DATA[currentIndex];
    speak(item.l + " for " + item.w + ".");
  });

  // ---------------- Speech ----------------
  let voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if ("speechSynthesis" in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(){
    if (!voices.length) return null;
    const preferred = voices.find(v => /female|samantha|victoria|zira|google us english/i.test(v.name) && /en/i.test(v.lang));
    return preferred || voices.find(v=>/en/i.test(v.lang)) || voices[0];
  }
  function speak(text){
    if (muted || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) utter.voice = v;
    utter.rate = 0.85;
    utter.pitch = 1.25;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
  }

  // ---------------- Mute buttons ----------------
  function toggleMute(){
    muted = !muted;
    document.querySelectorAll("#mute-btn, #mute-btn-2").forEach(b=> b.classList.toggle("muted", muted));
    if (muted && "speechSynthesis" in window) window.speechSynthesis.cancel();
  }
  document.getElementById("mute-btn").addEventListener("click", toggleMute);
  document.getElementById("mute-btn-2").addEventListener("click", toggleMute);

  // ---------------- Navigation buttons ----------------
  document.getElementById("start-btn").addEventListener("click", ()=> showScreen("alphabet"));
  document.getElementById("back-to-home-1").addEventListener("click", ()=> showScreen("home"));
  document.getElementById("back-to-home-2").addEventListener("click", ()=> showScreen("home"));
  document.getElementById("back-to-grid").addEventListener("click", ()=>{
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    showScreen("alphabet");
  });

  // Unlock speech synthesis on first touch (some mobile browsers require a user gesture)
  document.body.addEventListener("touchstart", function unlock(){
    if ("speechSynthesis" in window){
      const u = new SpeechSynthesisUtterance("");
      u.volume = 0;
      window.speechSynthesis.speak(u);
    }
    document.body.removeEventListener("touchstart", unlock);
  }, {once:true});

})();
</script>
</body>
</html>
